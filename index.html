<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section id="timer-panel" class="timer-panel">
      <div class="timer-content" aria-live="polite">
        <div id="time-display" class="time-display">10:00</div>
        <svg id="warning-icon" class="warning-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <polygon points="50,6 95,92 5,92" />
          <rect x="45" y="32" width="10" height="32" rx="4" ry="4" />
          <circle cx="50" cy="76" r="6" />
        </svg>
      </div>
    </section>

    <section id="controls-panel" class="controls-panel">

      <div class="row preset-buttons-row" id="preset-buttons">
        <button type="button" data-total-seconds="10" data-warning-seconds="5">10 s</button>
        <button type="button" data-total-seconds="60" data-warning-seconds="10">1 m</button>
        <button type="button" data-total-seconds="300" data-warning-seconds="30">5 m</button>
        <button type="button" data-total-seconds="600" data-warning-seconds="60">10 m</button>
        <button type="button" data-total-seconds="900" data-warning-seconds="80">15 m</button>
        <button type="button" data-total-seconds="1200" data-warning-seconds="90">20 m</button>
        <button type="button" data-total-seconds="1500" data-warning-seconds="100">25 m</button>
        <button type="button" data-total-seconds="1800" data-warning-seconds="110">30 m</button>
        <button type="button" data-total-seconds="2400" data-warning-seconds="120">40 m</button>
        <button type="button" data-total-seconds="2700" data-warning-seconds="120">45 m</button>
        <button type="button" data-total-seconds="3000" data-warning-seconds="150">50 m</button>
        <button type="button" data-total-seconds="3300" data-warning-seconds="150">55 m</button>
        <button type="button" data-total-seconds="3600" data-warning-seconds="150">60 m</button>
      </div>

      <div class="row">
        <input id="minutes-input" type="number" min="0" max="999" value="10">
        <label for="minutes-input">minutes</label>
        <input id="seconds-input" type="number" min="0" max="59" value="0">
        <label for="seconds-input">seconds</label>
        <label for="warning-seconds-input">| Warning (seconds):</label>
        <input id="warning-seconds-input" type="number" min="0" max="9999" value="10">
      </div>

      <div class="row buttons-row">
        <button id="start-btn" type="button">Start</button>
        <button id="pause-btn" type="button">Pause</button>
        <button id="reset-btn" type="button">Reset</button>
        <button id="fullscreen-btn" type="button">Fullscreen</button>
        <button id="ding-btn" type="button">ding!</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
